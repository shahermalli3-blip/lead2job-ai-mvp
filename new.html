<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nieuwe klant - Lead2Job</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#0f172a}.wrap{max-width:620px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border-radius:22px;padding:22px;margin-top:16px;box-shadow:0 6px 24px rgba(15,23,42,.06)}h1{margin:0;font-size:32px}.muted{color:#64748b}label{display:block;font-weight:800;margin-top:16px}input,textarea{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:13px;font:inherit;margin-top:7px}textarea{min-height:110px;resize:vertical}.btn,button{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-weight:900;cursor:pointer;text-decoration:none;text-align:center;background:#2563eb;color:#fff;margin-top:18px}.back{width:auto;margin:0;background:#e2e8f0;color:#0f172a;padding:11px 14px}.success{background:#ecfdf5;color:#166534;font-weight:800}.error{color:#b91c1c;font-weight:800;margin-top:12px}.hidden{display:none}</style></head><body><div class="wrap"><div class="top"><div><h1>Nieuwe klant</h1><div class="muted">Alleen de belangrijkste informatie.</div></div><a class="btn back" href="/start.html">Terug</a></div><div id="formCard" class="card"><label>Naam</label><input id="name" placeholder="Naam klant" autocomplete="name"><label>Telefoon of e-mail</label><input id="contact" placeholder="06... of naam@email.nl"><label>Waarmee kunnen we helpen?</label><textarea id="description" placeholder="Bijv. wekelijkse schoonmaak van kantoor in Amsterdam"></textarea><button id="save" onclick="saveLead()">Klant toevoegen</button><div id="msg"></div></div><div id="done" class="card success hidden"><div style="font-size:24px">Klaar ✓</div><p>De klant staat erin. Lead2Job kan nu helpen met de volgende stap.</p><a id="aiBtn" class="btn" href="/actions.html">Wat moet ik nu doen?</a><a class="btn back" style="margin-top:10px" href="/start.html">Terug naar start</a></div></div><script>const SB_URL='https://npqiispbwwinnnvzyybx.supabase.co',SB_KEY='sb_publishable_-igxS01wBSa1ImPr0u4Xwg_fmbNMTuM';const sb=window.supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id);async function saveLead(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/start.html';return}const name=$('name').value.trim(),contact=$('contact').value.trim(),description=$('description').value.trim();if(!name)return $('msg').innerHTML='<div class="error">Vul de naam in.</div>';const isEmail=contact.includes('@');$('save').disabled=true;$('save').textContent='Even opslaan...';const payload={name,description:description||null,channel:'manual',status:'new',owner_id:session.user.id};if(contact){if(isEmail)payload.email=contact;else payload.phone=contact}const {data,error}=await sb.from('leads').insert(payload).select('id').single();if(error){console.error(error);$('save').disabled=false;$('save').textContent='Klant toevoegen';$('msg').innerHTML='<div class="error">Opslaan lukt nu niet. Probeer opnieuw.</div>';return}$('formCard').classList.add('hidden');$('done').classList.remove('hidden');$('aiBtn').href='/agent.html?lead='+encodeURIComponent(data.id)}</script></body></html>
