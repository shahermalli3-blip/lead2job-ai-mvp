<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nieuwe aanvragen - Lead2Job</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#0f172a}.wrap{max-width:760px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#fff;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 6px 24px rgba(15,23,42,.06)}h1{margin:0}.muted{color:#64748b;line-height:1.45}.badge{display:inline-block;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:900;background:#dcfce7;color:#166534}.handoff{background:#ffedd5;color:#9a3412}.open{background:#e2e8f0;color:#475569}.next{background:#eff6ff;border:1px solid #bfdbfe;border-radius:15px;padding:14px;margin-top:14px}.next strong{display:block;color:#1d4ed8;font-size:13px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}a,button{border:0;border-radius:13px;padding:13px 16px;font:inherit;font-weight:900;text-decoration:none;cursor:pointer}.primary{background:#2563eb;color:#fff}.contact{background:#16a34a;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.empty{text-align:center;padding:28px}.contactline{margin-top:9px;font-weight:800}.hidden{display:none}button:disabled{opacity:.6;cursor:wait}@media(max-width:560px){.top{align-items:flex-start;flex-direction:column}.actions a,.actions button{width:100%;text-align:center}}</style></head><body><main class="wrap"><div class="top"><div><h1>Nieuwe aanvragen</h1><div class="muted">De AI verzamelt. Jij krijgt alleen wat je moet doen.</div></div><a class="secondary" href="/start.html">Terug</a></div><div id="status" class="card muted">Even laden...</div><div id="list"></div></main><script>const SB_URL='https://npqiispbwwinnnvzyybx.supabase.co',SB_KEY='sb_publishable_-igxS01wBSa1ImPr0u4Xwg_fmbNMTuM';const sb=window.supabase.createClient(SB_URL,SB_KEY),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function label(s){return s==='handoff'?'Jouw bevestiging nodig':s==='qualified'?'Klaar voor jou':'Gesprek loopt'}function klass(s){return s==='handoff'?'handoff':s==='open'?'open':''}function when(d){return new Date(d).toLocaleString('nl-NL',{dateStyle:'medium',timeStyle:'short'})}function phoneUrl(p){return 'tel:'+String(p||'').replace(/[^+\d]/g,'')}function waUrl(p){const n=String(p||'').replace(/\D/g,'');return 'https://wa.me/'+n}function contactAction(row,lead){if(!lead)return '';if(lead.phone&&row.channel==='whatsapp')return `<a class="contact" href="${waUrl(lead.phone)}" target="_blank" rel="noopener">Open WhatsApp</a>`;if(lead.phone)return `<a class="contact" href="${phoneUrl(lead.phone)}">Bel klant</a>`;if(lead.email)return `<a class="contact" href="mailto:${encodeURIComponent(lead.email)}">E-mail klant</a>`;return ''}async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/start.html';return}const {data,error}=await sb.from('conversations').select('id,lead_id,status,collected,updated_at,channel').in('status',['qualified','handoff','open']).order('updated_at',{ascending:false}).limit(50);if(error){$('status').textContent='Laden lukt nu niet.';return}const rows=data||[],leadIds=[...new Set(rows.map(x=>x.lead_id).filter(Boolean))];let leads=[],summaries=[];if(leadIds.length){const [l,a]=await Promise.all([sb.from('leads').select('id,name,phone,email,service_type,city,preferred_time').in('id',leadIds),sb.from('activities').select('lead_id,content,metadata,created_at').eq('type','ai_intake_summary').in('lead_id',leadIds).order('created_at',{ascending:false})]);leads=l.data||[];summaries=a.data||[]}$('status').innerHTML=rows.length?`<strong>${rows.filter(x=>x.status!=='open').length} klaar voor jou</strong><div class="muted">Begin bovenaan. Open gesprekken wachten nog op de klant.</div>`:'Nog geen aanvragen.';const leadMap=Object.fromEntries(leads.map(x=>[x.id,x])),summaryMap={};for(const s of summaries)if(!summaryMap[s.lead_id])summaryMap[s.lead_id]=s;$('list').innerHTML=rows.length?rows.map(x=>{const c=x.collected||{},lead=x.lead_id?leadMap[x.lead_id]:null,s=x.lead_id?summaryMap[x.lead_id]:null,parts=[c.city,c.preferred_time].filter(Boolean).join(' · '),next=s?.metadata?.next_action||'',summary=s?.content||c.description||'',contact=contactAction(x,lead);return `<div class="card"><span class="badge ${klass(x.status)}">${esc(label(x.status))}</span><h2 style="margin:11px 0 4px">${esc(c.name||lead?.name||'Nieuwe klant')}</h2><div><strong>${esc(c.service_type||lead?.service_type||'Aanvraag')}</strong></div>${parts?`<div class="muted" style="margin-top:5px">${esc(parts)}</div>`:''}${summary?`<div style="margin-top:12px">${esc(summary)}</div>`:''}${lead&&(lead.phone||lead.email)?`<div class="contactline">${esc(lead.phone||lead.email)}</div>`:''}${next&&x.status!=='open'?`<div class="next"><strong>Volgende stap</strong>${esc(next)}</div>`:''}<div class="muted" style="font-size:13px;margin-top:10px">Bijgewerkt ${esc(when(x.updated_at))}</div><div class="actions">${x.status!=='open'?contact:''}${x.lead_id?`<a class="primary" href="/agent.html?lead=${encodeURIComponent(x.lead_id)}">AI helpt mij</a>`:''}${x.status!=='open'?`<button class="secondary" onclick="closeReq('${x.id}','${x.lead_id||''}',this)">Afgehandeld</button>`:''}</div></div>`}).join(''):'<div class="card empty"><strong>Nog niets binnengekomen.</strong><div class="muted" style="margin-top:6px">Deel je klantlink om een aanvraag op te vangen.</div></div>'}async function closeReq(id,leadId,btn){btn.disabled=true;const old=btn.textContent;btn.textContent='Even opslaan...';const jobs=[sb.from('conversations').update({status:'closed',updated_at:new Date().toISOString()}).eq('id',id)];if(leadId)jobs.push(sb.from('follow_ups').update({status:'completed'}).eq('lead_id',leadId).eq('status','pending'));const results=await Promise.all(jobs),failed=results.find(x=>x.error);if(failed){btn.disabled=false;btn.textContent=old;return alert('Opslaan lukt nu niet.')}load()}load();</script></body></html>
