<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bedrijf instellen - Lead2Job</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#0f172a}.wrap{max-width:560px;margin:7vh auto;padding:20px}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 6px 24px rgba(15,23,42,.06)}h1{margin:0;font-size:32px}.muted{color:#64748b}label{display:block;font-weight:900;margin-top:17px}input{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:13px;font:inherit;margin-top:7px}button{width:100%;border:0;border-radius:14px;padding:16px;font:inherit;font-weight:900;background:#2563eb;color:#fff;margin-top:20px;cursor:pointer}.error{color:#b91c1c;font-weight:800;margin-top:12px}.hint{background:#ecfdf5;color:#166534;padding:13px;border-radius:13px;margin-top:18px;font-weight:700}.switch{display:block;width:100%;border:0;background:none;color:#64748b;margin-top:18px;padding:8px;font:inherit;font-weight:800;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><h1>Welkom 👋</h1><p class="muted">Drie dingen en je kunt beginnen.</p><label>Naam van je bedrijf</label><input id="business" placeholder="Bijv. De Beste Schoonmaak"><label>Wat doe je?</label><input id="service" placeholder="Bijv. Schoonmaak"><label>Waar werk je?</label><input id="city" placeholder="Bijv. Amsterdam"><button id="save" onclick="save()">Beginnen</button><div id="msg"></div><div class="hint">Dit hoef je maar één keer in te vullen.</div><button class="switch" onclick="switchAccount()">Ander account gebruiken</button></div></div><script>const sb=window.supabase.createClient('https://npqiispbwwinnnvzyybx.supabase.co','sb_publishable_-igxS01wBSa1ImPr0u4Xwg_fmbNMTuM'),$=id=>document.getElementById(id);async function init(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='/start.html';const {data}=await sb.from('profiles').select('business_name,service_type,city').eq('id',session.user.id).maybeSingle();if(data?.business_name&&data?.service_type&&data?.city)return location.href='/start.html';if(data){$('business').value=data.business_name||'';$('service').value=data.service_type||'';$('city').value=data.city||''}}async function switchAccount(){await sb.auth.signOut();location.href='/start.html'}async function save(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='/start.html';const business=$('business').value.trim(),service=$('service').value.trim(),city=$('city').value.trim();if(!business||!service||!city)return $('msg').innerHTML='<div class="error">Vul de drie korte velden in.</div>';$('save').disabled=true;$('save').textContent='Even opslaan...';const {error}=await sb.from('profiles').upsert({id:session.user.id,business_name:business,service_type:service,city,updated_at:new Date().toISOString()},{onConflict:'id'});if(error){$('save').disabled=false;$('save').textContent='Beginnen';return $('msg').innerHTML='<div class="error">Opslaan lukt nu niet. Probeer opnieuw.</div>'}location.href='/start.html'}init();</script></body></html>
