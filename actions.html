<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead2Job Acties</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#0f172a}.wrap{max-width:800px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.card{background:#fff;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 6px 24px rgba(15,23,42,.06)}.item{border:1px solid #e2e8f0;border-radius:14px;padding:15px;margin-top:10px}.muted{color:#64748b}.due{font-weight:800}.late{color:#b91c1c}.soon{color:#9a3412}button,a{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.green{background:#16a34a;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.badge.appointment{background:#dcfce7;color:#166534}.empty{text-align:center;padding:24px;color:#64748b}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1 style="margin-bottom:4px">Acties</h1><div class="muted">Open follow-ups en afspraken die aandacht nodig hebben</div></div><div><a class="secondary" href="/agent.html">AI Agent</a> <a class="secondary" href="/">Dashboard</a></div></div><div id="status" class="card muted">Sessie controleren...</div><div id="list"></div></div><script>const SB_URL='https://npqiispbwwinnnvzyybx.supabase.co',SB_KEY='sb_publishable_-igxS01wBSa1ImPr0u4Xwg_fmbNMTuM';const sb=window.supabase.createClient(SB_URL,SB_KEY);const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let leads=[],items=[];function when(d){return new Date(d).toLocaleString('nl-NL',{dateStyle:'medium',timeStyle:'short'})}function dueClass(d){const x=new Date(d)-Date.now();return x<0?'late':x<86400000?'soon':''}function lead(id){return leads.find(x=>x.id===id)||{}}async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){$('status').innerHTML='Niet ingelogd. <a href="/">Log eerst in via het dashboard.</a>';return}const [l,f,a]=await Promise.all([sb.from('leads').select('id,name,service_type,city,status'),sb.from('follow_ups').select('id,lead_id,due_at,channel,status,message').eq('status','pending'),sb.from('appointments').select('id,lead_id,starts_at,ends_at,status,notes').in('status',['booked','confirmed'])]);if(l.error||f.error||a.error){$('status').textContent='Laden mislukt: '+(l.error||f.error||a.error).message;return}leads=l.data||[];items=[...(f.data||[]).map(x=>({type:'followup',id:x.id,lead_id:x.lead_id,time:x.due_at,badge:x.channel||'follow-up',text:x.message||''})),...(a.data||[]).map(x=>({type:'appointment',id:x.id,lead_id:x.lead_id,time:x.starts_at,badge:'afspraak',text:x.notes||''}))].sort((x,y)=>new Date(x.time)-new Date(y.time));$('status').innerHTML='<strong>'+items.length+' open actie'+(items.length===1?'':'s')+'.</strong> Niets wordt automatisch naar klanten verstuurd.';render()}function render(){if(!items.length){$('list').innerHTML='<div class="card empty">Geen open acties. Alles is bijgewerkt.</div>';return}$('list').innerHTML=items.map(i=>{const l=lead(i.lead_id);return `<div class="card item"><div class="badge ${i.type==='appointment'?'appointment':''}">${esc(i.badge)}</div><h2 style="margin:10px 0 4px">${esc(l.name||'Klant')}</h2><div class="muted">${esc(l.service_type||'')} ${l.city?'· '+esc(l.city):''}</div><div class="due ${dueClass(i.time)}" style="margin-top:12px">${esc(when(i.time))}</div>${i.text?`<div style="white-space:pre-wrap;margin-top:12px">${esc(i.text)}</div>`:''}<div class="actions"><button class="green" onclick="complete('${i.type}','${i.id}',this)">${i.type==='appointment'?'Afspraak afgerond':'Markeer als gedaan'}</button><button class="secondary" onclick="location.href='/agent.html'">Open AI Agent</button></div></div>`}).join('')}async function complete(type,id,btn){btn.disabled=true;btn.textContent='Opslaan...';const q=type==='appointment'?sb.from('appointments').update({status:'completed'}).eq('id',id):sb.from('follow_ups').update({status:'sent'}).eq('id',id);const {error}=await q;if(error){btn.disabled=false;btn.textContent=type==='appointment'?'Afspraak afgerond':'Markeer als gedaan';return alert(error.message)}await load()}load();</script></body></html>
