<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead2Job Vandaag</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#0f172a}.wrap{max-width:760px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:#fff;border-radius:20px;padding:20px;margin-top:16px;box-shadow:0 6px 24px rgba(15,23,42,.06)}.item{border:1px solid #e2e8f0}.muted{color:#64748b}.due{font-weight:800;margin-top:12px}.late{color:#b91c1c}.soon{color:#9a3412}button,a{border:0;border-radius:13px;padding:13px 17px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.green{background:#16a34a;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.badge{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.badge.appointment{background:#dcfce7;color:#166534}.empty{text-align:center;padding:28px;color:#64748b}.hero h1{font-size:36px;margin:0 0 5px}.count{font-size:20px}.safe{color:#15803d;font-weight:700}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.hero h1{font-size:32px}.actions button,.actions a{flex:1;text-align:center}}</style></head><body><div class="wrap"><div class="top hero"><div><h1>Vandaag</h1><div class="muted">Alleen wat nu aandacht nodig heeft.</div></div><a class="secondary" href="/start.html">Terug</a></div><div id="status" class="card muted">Even laden...</div><div id="list"></div></div><script>const SB_URL='https://npqiispbwwinnnvzyybx.supabase.co',SB_KEY='sb_publishable_-igxS01wBSa1ImPr0u4Xwg_fmbNMTuM';const sb=window.supabase.createClient(SB_URL,SB_KEY);const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let leads=[],items=[];function when(d){return new Date(d).toLocaleString('nl-NL',{dateStyle:'medium',timeStyle:'short'})}function dueClass(d){const x=new Date(d)-Date.now();return x<0?'late':x<86400000?'soon':''}function lead(id){return leads.find(x=>x.id===id)||{}}async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){$('status').innerHTML='Je bent niet ingelogd. <a href="/start.html">Inloggen</a>';return}const [l,f,a]=await Promise.all([sb.from('leads').select('id,name,service_type,city,status'),sb.from('follow_ups').select('id,lead_id,due_at,channel,status,message').eq('status','pending'),sb.from('appointments').select('id,lead_id,starts_at,ends_at,status,notes').in('status',['booked','confirmed'])]);if(l.error||f.error||a.error){$('status').textContent='Laden lukt nu niet. Probeer het opnieuw.';return}leads=l.data||[];items=[...(f.data||[]).map(x=>({type:'followup',id:x.id,lead_id:x.lead_id,time:x.due_at,badge:'Contact opnemen',text:x.message||''})),...(a.data||[]).map(x=>({type:'appointment',id:x.id,lead_id:x.lead_id,time:x.starts_at,badge:'Afspraak',text:x.notes||''}))].sort((x,y)=>new Date(x.time)-new Date(y.time));$('status').innerHTML=items.length?`<div class="count"><strong>${items.length} ${items.length===1?'ding':'dingen'} te doen</strong></div><div class="safe">Werk gewoon van boven naar beneden.</div>`:'Alles is klaar voor nu.';render()}function render(){if(!items.length){$('list').innerHTML='<div class="card empty"><strong>Alles gedaan ✓</strong><br>Je hoeft nu niets te doen.</div>';return}$('list').innerHTML=items.map(i=>{const l=lead(i.lead_id);const done=i.type==='appointment'?'Afspraak klaar':'Gedaan';return `<div class="card item"><div class="badge ${i.type==='appointment'?'appointment':''}">${i.badge}</div><h2 style="margin:11px 0 4px">${esc(l.name||'Klant')}</h2><div class="muted">${esc(l.service_type||'')} ${l.city?'· '+esc(l.city):''}</div><div class="due ${dueClass(i.time)}">${esc(when(i.time))}</div>${i.text?`<div style="white-space:pre-wrap;margin-top:13px">${esc(i.text)}</div>`:''}<div class="actions"><button class="green" onclick="complete('${i.type}','${i.id}',this)">${done}</button><a class="secondary" href="/agent.html?lead=${encodeURIComponent(i.lead_id)}">AI helpt mij</a></div></div>`}).join('')}async function complete(type,id,btn){btn.disabled=true;btn.textContent='Moment...';const q=type==='appointment'?sb.from('appointments').update({status:'completed'}).eq('id',id):sb.from('follow_ups').update({status:'sent'}).eq('id',id);const {error}=await q;if(error){btn.disabled=false;btn.textContent=type==='appointment'?'Afspraak klaar':'Gedaan';return alert('Opslaan lukt nu niet. Probeer opnieuw.')}await load()}load();</script></body></html>
