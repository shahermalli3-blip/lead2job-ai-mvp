<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>Digitale assistent</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#0f172a}.wrap{max-width:680px;margin:auto;padding:18px}.brand{font-size:13px;font-weight:900;color:#2563eb;text-transform:uppercase;letter-spacing:.04em}.card{background:#fff;border-radius:22px;padding:20px;margin-top:14px;box-shadow:0 6px 24px rgba(15,23,42,.06)}h1{font-size:29px;margin:5px 0 6px}.muted{color:#64748b;line-height:1.45}.notice{font-size:13px;background:#eff6ff;color:#334155;border-radius:14px;padding:12px;margin-top:14px}.notice a{color:#2563eb;font-weight:800}.chat{display:flex;flex-direction:column;gap:10px;min-height:250px;max-height:55vh;overflow:auto;padding:4px}.bubble{max-width:86%;padding:12px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.4}.customer{align-self:flex-end;background:#2563eb;color:white}.ai{align-self:flex-start;background:#e2e8f0}.row{display:flex;gap:9px;margin-top:12px}input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:13px;font:inherit;font-size:16px}.row input{flex:1}button{border:0;border-radius:13px;padding:13px 16px;background:#2563eb;color:#fff;font:inherit;font-weight:900;cursor:pointer}button:disabled{opacity:.55}.status{font-size:13px;margin-top:9px;color:#64748b}.good{color:#166534}.bad{color:#b91c1c}.hidden{display:none}.contact label{font-weight:900;display:block;margin-bottom:7px}.contact button{width:100%;margin-top:10px;padding:15px}</style></head><body><main class="wrap"><div class="card"><div class="brand">Lead2Job</div><h1 id="title">Digitale assistent</h1><div id="subtitle" class="muted">Even laden…</div><div class="notice">Je praat met de digitale AI-assistent van dit bedrijf. Je gegevens worden gebruikt om je aanvraag door te geven. Prijs en afspraak worden door het bedrijf bevestigd. <a href="/privacy.html" target="_blank" rel="noopener">Privacy</a></div></div><div id="contactCard" class="card contact"><label for="contact">Waar kunnen we je bereiken?</label><input id="contact" placeholder="Telefoonnummer of e-mail" autocomplete="email"><div class="muted" style="font-size:13px;margin-top:6px">Alleen nodig zodat het bedrijf op je aanvraag kan reageren.</div><button id="startBtn">Start gesprek</button><div id="contactMsg" class="status"></div></div><div id="chatCard" class="card hidden"><div id="chat" class="chat"></div><div class="row"><input id="msg" autocomplete="off" placeholder="Typ je bericht…"><button id="send">Stuur</button></div><div id="status" class="status"></div></div></main><script>const SB_URL='https://npqiispbwwinnnvzyybx.supabase.co',SB_KEY='sb_publishable_-igxS01wBSa1ImPr0u4Xwg_fmbNMTuM';const sb=window.supabase.createClient(SB_URL,SB_KEY),params=new URLSearchParams(location.search),token=params.get('token'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),contactCard=document.getElementById('contactCard'),chatCard=document.getElementById('chatCard'),contact=document.getElementById('contact'),contactMsg=document.getElementById('contactMsg'),startBtn=document.getElementById('startBtn'),chat=document.getElementById('chat'),msg=document.getElementById('msg'),send=document.getElementById('send'),statusEl=document.getElementById('status');let business='dit bedrijf',customerContact='',conversationId=null,busy=false;function bubble(text,who){const d=document.createElement('div');d.className='bubble '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function validContact(v){if(v.includes('@'))return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);return v.replace(/\D/g,'').length>=8}async function init(){if(!token){title.textContent='Link niet geldig';subtitle.textContent='Vraag het bedrijf om een nieuwe klantlink.';contactCard.classList.add('hidden');return}const {data,error}=await sb.rpc('reception_public_business',{p_token:token});if(error||!data){title.textContent='Link niet geldig';subtitle.textContent='Vraag het bedrijf om een nieuwe klantlink.';contactCard.classList.add('hidden');return}business=data.business_name||'dit bedrijf';title.textContent=business;subtitle.textContent='Vertel kort waarmee we je kunnen helpen.';document.title=business+' — digitale assistent'}function begin(){const v=contact.value.trim();if(!validContact(v)){contactMsg.textContent='Controleer je telefoonnummer of e-mailadres.';contactMsg.className='status bad';return}customerContact=v;contactCard.classList.add('hidden');chatCard.classList.remove('hidden');bubble('Hoi 👋 Ik ben de digitale AI-assistent van '+business+'. Waarmee kunnen we je helpen?','ai');msg.focus()}async function go(){const text=msg.value.trim();if(!text||busy)return;busy=true;send.disabled=true;msg.value='';bubble(text,'customer');statusEl.textContent='Even antwoorden…';try{const r=await fetch(SB_URL+'/functions/v1/receive-customer-message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,conversation_id:conversationId,channel:'website',external_contact:customerContact,message:text})});const p=await r.json();if(!r.ok||!p.success)throw new Error(p.error||'failed');conversationId=p.conversation_id;bubble(p.reply,'ai');statusEl.textContent=p.lead_id?'Aanvraag ontvangen ✓':'Gesprek loopt';statusEl.className='status good'}catch(e){console.error(e);bubble('Sorry, dit lukt nu niet. Probeer het nog eens.','ai');statusEl.textContent='Er ging iets mis.';statusEl.className='status bad'}finally{busy=false;send.disabled=false;msg.focus()}}startBtn.addEventListener('click',begin);contact.addEventListener('keydown',e=>{if(e.key==='Enter')begin()});send.addEventListener('click',go);msg.addEventListener('keydown',e=>{if(e.key==='Enter')go()});init();</script></body></html>
