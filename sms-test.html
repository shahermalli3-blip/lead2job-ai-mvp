<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead2Job SMS Test</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f4f7fb;color:#0f172a;margin:0}.w{max-width:760px;margin:40px auto;padding:16px}.c{background:#fff;padding:22px;border-radius:18px;box-shadow:0 6px 24px #0f172a10;margin-bottom:14px}input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #cbd5e1;box-sizing:border-box;font:inherit}button{background:#2563eb;color:#fff;border:0;font-weight:700}.muted{color:#64748b}.ok{color:#15803d}.err{color:#b91c1c}.hide{display:none}</style></head><body><div class="w"><div class="c"><h1>Lead2Job AI</h1><p class="muted">Gratis SMS testmodus — er wordt niets betaald of echt verzonden.</p><div id="login"><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Wachtwoord"><button id="loginBtn">Inloggen</button></div><div id="app" class="hide"><p id="user" class="ok"></p><select id="lead"></select><textarea id="message" rows="5">Bedankt voor uw aanvraag. We hebben uw aanvraag ontvangen en nemen zo snel mogelijk contact met u op.</textarea><button id="sendBtn">Test SMS</button><button id="logoutBtn" style="background:#475569">Uitloggen</button><pre id="result"></pre></div><p id="status"></p></div></div><script>const sb=window.supabase.createClient('https://npqiispbwwinnnvzyybx.supabase.co','sb_publishable_-igxS01wBSa1ImPr0u4Xwg_fmbNMTuM');const $=x=>document.getElementById(x);async function refresh(){const {data:{session}}=await sb.auth.getSession();$('login').classList.toggle('hide',!!session);$('app').classList.toggle('hide',!session);if(!session)return;$('user').textContent='● '+session.user.email;const {data,error}=await sb.from('leads').select('id,name,phone').not('phone','is',null).order('created_at',{ascending:false});if(error){$('status').textContent=error.message;return}$('lead').innerHTML=(data||[]).map(l=>`<option value="${l.id}" data-phone="${String(l.phone||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${String(l.name||'Klant').replace(/</g,'&lt;')} — ${String(l.phone||'')}</option>`).join('')||'<option value="">Geen leads met telefoonnummer</option>'} $('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('status').textContent=error?error.message:'';await refresh()};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();await refresh()};$('sendBtn').onclick=async()=>{const o=$('lead').selectedOptions[0];if(!o||!o.value)return;$('sendBtn').disabled=true;const {data,error}=await sb.functions.invoke('send-sms',{body:{lead_id:o.value,to:o.dataset.phone,body:$('message').value}});$('result').textContent=JSON.stringify(error?{error:error.message}:data,null,2);$('sendBtn').disabled=false};sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();</script></body></html>
