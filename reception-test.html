<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI receptionist test - Lead2Job</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#0f172a}.wrap{max-width:680px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#fff;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 6px 24px rgba(15,23,42,.06)}h1{margin:0;font-size:30px}.muted{color:#64748b}.chat{display:flex;flex-direction:column;gap:10px;min-height:260px;max-height:58vh;overflow:auto;padding:6px}.bubble{max-width:86%;padding:12px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.4}.customer{align-self:flex-end;background:#2563eb;color:#fff}.ai{align-self:flex-start;background:#e2e8f0}.row{display:flex;gap:10px;margin-top:14px}input{flex:1;padding:15px;border:1px solid #cbd5e1;border-radius:14px;font:inherit;font-size:16px}button,.btn{border:0;border-radius:14px;padding:14px 16px;font:inherit;font-weight:900;background:#2563eb;color:#fff;text-decoration:none;cursor:pointer}.back{background:#e2e8f0;color:#0f172a}.status{font-size:13px;color:#64748b;margin-top:10px}.good{color:#166534}.bad{color:#b91c1c}</style></head><body><div class="wrap"><div class="top"><div><h1>AI receptionist</h1><div class="muted">Interne test — alsof een klant je bedrijf appt.</div></div><a class="btn back" href="/start.html">Terug</a></div><div class="card"><div id="chat" class="chat"><div class="bubble ai">Hoi 👋 Waarmee kan ik je helpen?</div></div><div class="row"><input id="msg" autocomplete="off" placeholder="Typ als klant…"><button id="send">Stuur</button></div><div id="status" class="status">Voorbereiden…</div></div></div><script>const SB_URL='https://npqiispbwwinnnvzyybx.supabase.co',SB_KEY='sb_publishable_-igxS01wBSa1ImPr0u4Xwg_fmbNMTuM';const sb=window.supabase.createClient(SB_URL,SB_KEY);const chat=document.getElementById('chat'),msg=document.getElementById('msg'),send=document.getElementById('send'),statusEl=document.getElementById('status');let token=null,conversationId=null,busy=false;function bubble(text,who){const d=document.createElement('div');d.className='bubble '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='/start.html';return}let {data:inbox,error}=await sb.from('inboxes').select('public_token').eq('owner_id',session.user.id).eq('enabled',true).order('created_at',{ascending:false}).limit(1).maybeSingle();if(error){statusEl.textContent='Test kan nu niet starten.';statusEl.className='status bad';return}if(!inbox){const created=await sb.from('inboxes').insert({owner_id:session.user.id,name:'AI receptionist',enabled:true}).select('public_token').single();if(created.error){statusEl.textContent='Test kan nu niet starten.';statusEl.className='status bad';return}inbox=created.data}token=inbox.public_token;statusEl.textContent='Klaar. Typ een bericht alsof je klant bent.';statusEl.className='status good';msg.focus()}async function go(){const text=msg.value.trim();if(!text||busy||!token)return;busy=true;send.disabled=true;msg.value='';bubble(text,'customer');statusEl.textContent='AI antwoordt…';try{const r=await fetch(SB_URL+'/functions/v1/receive-customer-message',{method:'POST',headers:{'Content-Type':'application/json','x-inbox-token':token},body:JSON.stringify({conversation_id:conversationId,channel:'web_test',external_contact:'pilot-test',message:text})});const p=await r.json();if(!r.ok||!p.success)throw new Error(p.error||'Onbekende fout');conversationId=p.conversation_id;bubble(p.reply,'ai');statusEl.textContent=p.lead_id?'Klant automatisch geregistreerd ✓':'Gesprek loopt — nog niet genoeg informatie om te registreren.';statusEl.className='status good'}catch(e){console.error(e);bubble('Sorry, dit lukt nu niet. Probeer het nog eens.','ai');statusEl.textContent='Er ging iets mis in de test.';statusEl.className='status bad'}finally{busy=false;send.disabled=false;msg.focus()}}send.addEventListener('click',go);msg.addEventListener('keydown',e=>{if(e.key==='Enter')go()});init();</script></body></html>
