<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead2Job AI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}.container{max-width:980px;margin:auto;padding:22px}.header{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:20px}.logo{font-size:32px;font-weight:800}.sub{color:#64748b;margin-top:3px}.status{background:#dcfce7;color:#15803d;padding:10px 15px;border-radius:999px;white-space:nowrap;font-weight:700}.card{background:#fff;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 5px 20px rgba(0,0,0,.05)}h2{margin-top:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f8fafc;padding:18px;border-radius:16px}.stat strong{display:block;font-size:28px;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar button,.smallbtn{width:auto}.lead{border:1px solid #e5e7eb;padding:18px;border-radius:16px;margin:12px 0;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.lead h3{margin:0 0 6px}.meta{color:#64748b;font-size:14px}.price{font-size:22px;font-weight:800;margin-top:7px}.badge{display:inline-block;padding:7px 11px;border-radius:999px;margin-top:8px;font-size:14px;background:#eef2ff;color:#2563eb}.badge.won{background:#dcfce7;color:#15803d}.badge.follow_up{background:#fff7ed;color:#c2410c}.badge.quote_sent{background:#ede9fe;color:#6d28d9}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}button{background:#2563eb;color:#fff;border:0;padding:12px 16px;border-radius:12px;font-size:15px;cursor:pointer}button.secondary{background:#e2e8f0;color:#0f172a}button.success{background:#16a34a}button:disabled{opacity:.6;cursor:not-allowed}.formgrid{display:grid;grid-template-columns:1.5fr 1.5fr 1fr 1fr;gap:10px}.formgrid input,.formgrid select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;background:#fff}.notice{margin-top:10px;font-weight:700}.ok{color:#15803d}.error{color:#b91c1c}.empty{color:#64748b;text-align:center;padding:20px}.footer-note{font-size:13px;color:#64748b;margin-top:8px}@media(max-width:700px){.container{padding:14px}.header{align-items:flex-start}.logo{font-size:27px}.stats{grid-template-columns:repeat(2,1fr)}.lead{grid-template-columns:1fr}.actions{justify-content:flex-start}.formgrid{grid-template-columns:1fr}.status{font-size:13px;padding:8px 10px}}
  </style>
</head>
<body>
<div class="container">
  <div class="header"><div><div class="logo">Lead2Job AI</div><div class="sub">AI Revenue Agent voor servicebedrijven</div></div><div class="status" id="systemStatus">● Verbinden...</div></div>

  <div class="card">
    <h2>Dashboard</h2>
    <div class="stats">
      <div class="stat">Leads<strong id="statLeads">0</strong></div>
      <div class="stat">Offertes<strong id="statQuotes">0</strong></div>
      <div class="stat">Actie nodig<strong id="statAction">0</strong></div>
      <div class="stat">Open kansen<strong id="statValue">€0</strong></div>
    </div>
  </div>

  <div class="card">
    <h2>Nieuwe lead toevoegen</h2>
    <div class="formgrid">
      <input id="nameInput" placeholder="Naam klant" autocomplete="name">
      <input id="serviceInput" placeholder="Dienst, bijv. CV-storing">
      <input id="valueInput" type="number" min="0" placeholder="Geschatte €">
      <select id="urgencyInput"><option value="normal">Normaal</option><option value="high">Hoog</option><option value="emergency">Spoed</option><option value="low">Laag</option></select>
    </div>
    <button id="addButton" style="margin-top:10px" onclick="addLead()">Lead toevoegen</button>
    <div id="formResult" class="notice" aria-live="polite"></div>
    <div class="footer-note">Leads worden veilig via de server opgeslagen in Supabase.</div>
  </div>

  <div class="card">
    <div class="toolbar">
      <button class="secondary" onclick="setFilter('all')">Alles</button>
      <button class="secondary" onclick="setFilter('new')">Nieuw</button>
      <button class="secondary" onclick="setFilter('follow_up')">Follow-up</button>
      <button class="secondary" onclick="setFilter('quote_sent')">Offerte</button>
      <button class="secondary" onclick="setFilter('won')">Gewonnen</button>
    </div>
    <h2>Pipeline</h2>
    <div id="leadList"><div class="empty">Leads laden...</div></div>
  </div>
</div>

<script>
let filter='all';
let leads=[];

function euro(n){return new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0);}
function escapeHtml(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));}
function label(status){return ({new:'Nieuw',qualified:'Gekwalificeerd',booked:'Afspraak',quote_sent:'Offerte verstuurd',follow_up:'AI volgt op',won:'Gewonnen',lost:'Verloren'})[status]||status;}
function leadValue(l){return Number(l.estimated_value_max ?? l.estimated_value_min ?? 0);}
function setFilter(value){filter=value;render();}

function render(){
  document.getElementById('statLeads').textContent=leads.length;
  document.getElementById('statQuotes').textContent=leads.filter(l=>l.status==='quote_sent').length;
  document.getElementById('statAction').textContent=leads.filter(l=>['new','qualified','follow_up'].includes(l.status)).length;
  document.getElementById('statValue').textContent=euro(leads.filter(l=>!['won','lost'].includes(l.status)).reduce((s,l)=>s+leadValue(l),0));
  const shown=filter==='all'?leads:leads.filter(l=>l.status===filter);
  const list=document.getElementById('leadList');
  if(!shown.length){list.innerHTML='<div class="empty">Geen leads in deze fase.</div>';return;}
  list.innerHTML=shown.map(l=>`<div class="lead"><div><h3>${escapeHtml(l.name||'Onbekende klant')}</h3><div class="meta">${escapeHtml(l.service_type||'Geen dienst')} · ${escapeHtml(l.city||'Locatie onbekend')} · urgentie: ${escapeHtml(l.urgency||'normal')}</div><div class="price">${euro(leadValue(l))}</div><span class="badge ${escapeHtml(l.status)}">${escapeHtml(label(l.status))}</span></div><div class="actions"><button class="smallbtn secondary" onclick="changeStatus('${l.id}','follow_up')">Follow-up</button><button class="smallbtn" onclick="changeStatus('${l.id}','quote_sent')">Offerte</button><button class="smallbtn success" onclick="changeStatus('${l.id}','won')">Gewonnen</button></div></div>`).join('');
}

async function loadLeads(){
  try{
    const response=await fetch('/api/leads',{cache:'no-store'});
    const data=await response.json();
    if(!response.ok||!data.success)throw new Error(data.error||'Leads laden mislukt');
    leads=Array.isArray(data.leads)?data.leads:[];
    document.getElementById('systemStatus').textContent='● Systeem actief';
    render();
  }catch(e){
    document.getElementById('systemStatus').textContent='● Configuratie nodig';
    document.getElementById('leadList').innerHTML=`<div class="empty error">${escapeHtml(e.message||'Kan geen verbinding maken')}</div>`;
  }
}

async function addLead(){
  const name=document.getElementById('nameInput').value.trim();
  const service=document.getElementById('serviceInput').value.trim();
  const valueRaw=document.getElementById('valueInput').value;
  const urgency=document.getElementById('urgencyInput').value;
  const result=document.getElementById('formResult');
  const button=document.getElementById('addButton');
  result.className='notice';result.textContent='';
  if(!name||!service){result.className='notice error';result.textContent='Vul naam en dienst in.';return;}
  const value=valueRaw===''?null:Number(valueRaw);
  if(value!==null&&(!Number.isFinite(value)||value<0)){result.className='notice error';result.textContent='Vul een geldig bedrag in.';return;}
  button.disabled=true;
  try{
    const response=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,service,value,urgency,channel:'manual'})});
    const data=await response.json();
    if(!response.ok||!data.success)throw new Error(data.error||'Lead kon niet worden opgeslagen');
    if(data.lead)leads.unshift(data.lead);
    render();
    document.getElementById('nameInput').value='';document.getElementById('serviceInput').value='';document.getElementById('valueInput').value='';
    result.className='notice ok';result.textContent='Lead opgeslagen in Supabase.';
  }catch(e){result.className='notice error';result.textContent=e.message||'Er ging iets mis.';}finally{button.disabled=false;}
}

async function changeStatus(id,status){
  try{
    const response=await fetch('/api/leads',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});
    const data=await response.json();
    if(!response.ok||!data.success)throw new Error(data.error||'Status wijzigen mislukt');
    leads=leads.map(l=>l.id===id?(data.lead||{...l,status}):l);
    render();
  }catch(e){alert(e.message||'Er ging iets mis.');}
}

loadLeads();
</script>
</body>
</html>
