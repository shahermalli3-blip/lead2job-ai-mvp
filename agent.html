<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lead2Job AI Hulp</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#0f172a}.wrap{max-width:860px;margin:auto;padding:20px}.top,.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{font-size:32px;font-weight:900}.muted{color:#64748b}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 6px 24px rgba(15,23,42,.06);margin-top:14px}.lead{border:1px solid #e2e8f0}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}button,a.btn{border:0;border-radius:13px;padding:13px 17px;font:inherit;font-weight:800;cursor:pointer;background:#4f46e5;color:#fff;text-decoration:none;display:inline-block}button.secondary,a.secondary{background:#e2e8f0;color:#0f172a}button.green{background:#16a34a}button:disabled{opacity:.55}.result{white-space:pre-wrap;line-height:1.6;background:#f8fafc;border-radius:14px;padding:16px;margin-top:12px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:14px}.hidden{display:none!important}.modalbox{background:#fff;border-radius:20px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}input,select,textarea{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font:inherit;background:#fff;margin-top:9px}textarea{min-height:130px;resize:vertical}.success{color:#15803d;font-weight:800}.error{color:#b91c1c;font-weight:800}.mini{font-size:13px}.hint{background:#ecfdf5;color:#166534;border-radius:14px;padding:13px;font-weight:700}@media(max-width:600px){.row,.top{flex-direction:column}.brand{font-size:28px}.actions button,.actions a{flex:1;text-align:center}}</style></head>
<body><div class="wrap"><div class="top"><div><div class="brand">AI hulp</div><div class="muted">Kies een klant. Wij maken de volgende stap simpel.</div></div><div class="actions"><a class="btn secondary" href="/actions.html">Vandaag</a><a class="btn secondary" href="/">Overzicht</a></div></div><div id="status" class="card muted">Even laden...</div><div id="list"></div></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h3 id="title" style="margin:0">AI hulp</h3><button class="secondary" onclick="closeModal()">Sluiten</button></div><div id="body"></div></div></div>
<script>
const SB_URL='https://npqiispbwwinnnvzyybx.supabase.co',SB_KEY='sb_publishable_-igxS01wBSa1ImPr0u4Xwg_fmbNMTuM';const sb=window.supabase.createClient(SB_URL,SB_KEY);const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const aiResults={};let leads=[];
function openModal(title,html){$('title').textContent=title;$('body').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function leadById(id){return leads.find(l=>l.id===id)}function defaultChannel(l){if(l?.phone)return'whatsapp';if(l?.email)return'email';return'phone'}function localTomorrow(){const d=new Date(Date.now()+86400000);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){$('status').innerHTML='Je bent niet ingelogd. <a href="/">Inloggen</a>';return}const {data,error}=await sb.from('leads').select('id,name,phone,email,service_type,city,status,estimated_value_min,estimated_value_max').order('created_at',{ascending:false}).limit(100);if(error){$('status').textContent='Laden lukt nu niet. Probeer opnieuw.';$('status').className='card error';return}leads=data||[];$('status').innerHTML='<div class="hint">AI denkt mee. Jij kiest wat er gebeurt.</div>';$('status').className='card';render()}
function render(){if(!leads.length){$('list').innerHTML='<div class="card muted">Nog geen klanten.</div>';return}$('list').innerHTML=leads.map(l=>`<div class="card lead"><div class="row"><div><strong style="font-size:20px">${esc(l.name||'Klant')}</strong><div class="muted mini">${esc(l.service_type||'Dienst')} ${l.city?'· '+esc(l.city):''}</div></div><div><strong>€${Number(l.estimated_value_max||l.estimated_value_min||0).toLocaleString('nl-NL')}</strong></div></div><div class="actions"><button onclick="analyze('${l.id}',this)">Wat is de beste stap?</button></div></div>`).join('')}
async function analyze(id,btn){btn.disabled=true;const old=btn.textContent;btn.textContent='Even denken...';openModal('Beste stap voor '+(leadById(id)?.name||'deze klant'),'<div class="muted">Even kijken wat nu het slimst is...</div>');try{const {data,error}=await sb.functions.invoke('analyze-lead',{body:{lead_id:id}});if(error)throw error;if(!data?.success)throw new Error('Analyse mislukt');const a=data.analysis;aiResults[id]=a;const buttons=`<div class="actions">${a.needs_follow_up?`<button class="green" onclick="prepareFollowUp('${id}')">Contact voorbereiden</button>`:''}${a.needs_appointment?`<button class="secondary" onclick="prepareAppointment('${id}')">Afspraak voorbereiden</button>`:''}</div>`;$('body').innerHTML=`<div class="result"><strong>Dit raad ik aan:</strong>\n${esc(a.next_action)}\n\n<strong>Voorstel voor je bericht:</strong>\n${esc(a.reply_draft)}\n\n<strong>Korte uitleg:</strong>\n${esc(a.summary)}</div>${buttons}<p class="muted mini">Er gebeurt niets zonder jouw bevestiging.</p>`}catch(e){$('body').innerHTML='<div class="error">Dit lukt nu niet. Probeer het opnieuw.</div>'}finally{btn.disabled=false;btn.textContent=old}}
function prepareFollowUp(id){const a=aiResults[id],l=leadById(id);if(!a)return;const channel=defaultChannel(l);openModal('Contact voorbereiden',`<div class="muted mini">Controleer alleen tijd, kanaal en tekst.</div><input id="due" type="datetime-local" value="${localTomorrow()}"><select id="channel"><option value="whatsapp" ${channel==='whatsapp'?'selected':''}>WhatsApp</option><option value="email" ${channel==='email'?'selected':''}>E-mail</option><option value="phone" ${channel==='phone'?'selected':''}>Bellen</option></select><textarea id="message">${esc(a.reply_draft||'')}</textarea><div class="actions"><button class="green" onclick="saveFollowUp('${id}')">Zet op mijn lijst</button><button class="secondary" onclick="analyzeAgain('${id}')">Terug</button></div><div id="saveMsg"></div>`)}
async function saveFollowUp(id){const due=$('due').value,msg=$('message').value.trim(),channel=$('channel').value;if(!due)return $('saveMsg').innerHTML='<div class="error">Kies datum en tijd.</div>';const {error}=await sb.from('follow_ups').insert({lead_id:id,due_at:new Date(due).toISOString(),channel,status:'pending',message:msg||null});if(error)return $('saveMsg').innerHTML='<div class="error">Opslaan lukt nu niet. Probeer opnieuw.</div>';const u=await sb.from('leads').update({status:'follow_up'}).eq('id',id);if(u.error)return $('saveMsg').innerHTML='<div class="error">Opslaan lukt nu niet. Probeer opnieuw.</div>';$('body').innerHTML='<div class="success">Staat op je lijst ✓</div><div class="actions"><a class="btn green" href="/actions.html">Ga naar Vandaag</a></div>'}
function prepareAppointment(id){const a=aiResults[id];openModal('Afspraak voorbereiden',`<div class="muted mini">Kies alleen wanneer en hoe lang.</div><input id="aStart" type="datetime-local" value="${localTomorrow()}"><input id="aMinutes" type="number" min="15" step="15" value="60"><textarea id="aNotes">${esc(a?.next_action||'')}</textarea><div class="actions"><button class="green" onclick="saveAppointment('${id}')">Afspraak opslaan</button><button class="secondary" onclick="analyzeAgain('${id}')">Terug</button></div><div id="saveMsg"></div>`)}
async function saveAppointment(id){const start=$('aStart').value,min=Number($('aMinutes').value||60),notes=$('aNotes').value.trim();if(!start)return $('saveMsg').innerHTML='<div class="error">Kies datum en tijd.</div>';const s=new Date(start),e=new Date(s.getTime()+min*60000);const {error}=await sb.from('appointments').insert({lead_id:id,starts_at:s.toISOString(),ends_at:e.toISOString(),status:'booked',notes:notes||null});if(error)return $('saveMsg').innerHTML='<div class="error">Opslaan lukt nu niet. Probeer opnieuw.</div>';const u=await sb.from('leads').update({status:'booked'}).eq('id',id);if(u.error)return $('saveMsg').innerHTML='<div class="error">Opslaan lukt nu niet. Probeer opnieuw.</div>';$('body').innerHTML='<div class="success">Afspraak staat klaar ✓</div><div class="actions"><a class="btn green" href="/actions.html">Ga naar Vandaag</a></div>'}
function analyzeAgain(id){const a=aiResults[id];if(!a)return;openModal('Beste stap voor '+(leadById(id)?.name||'deze klant'),`<div class="result"><strong>Dit raad ik aan:</strong>\n${esc(a.next_action)}\n\n<strong>Voorstel voor je bericht:</strong>\n${esc(a.reply_draft)}</div><div class="actions">${a.needs_follow_up?`<button class="green" onclick="prepareFollowUp('${id}')">Contact voorbereiden</button>`:''}${a.needs_appointment?`<button class="secondary" onclick="prepareAppointment('${id}')">Afspraak voorbereiden</button>`:''}</div>`)}load();
</script></body></html>
