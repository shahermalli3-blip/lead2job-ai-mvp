<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Lead2Job AI Agent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#0f172a}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.brand{font-size:28px;font-weight:900}.muted{color:#64748b}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 24px rgba(15,23,42,.06);margin-top:12px}.lead{border:1px solid #e2e8f0;border-radius:15px;padding:15px;margin-top:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,a.btn{border:0;border-radius:11px;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer;background:#4f46e5;color:#fff;text-decoration:none;display:inline-block}button.secondary,a.secondary{background:#e2e8f0;color:#0f172a}button.green{background:#16a34a}button:disabled{opacity:.55}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e0e7ff;color:#3730a3;font-size:12px;font-weight:800}.result{white-space:pre-wrap;line-height:1.55;background:#f8fafc;border-radius:12px;padding:14px;margin-top:10px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:14px}.hidden{display:none!important}.modalbox{background:#fff;border-radius:18px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font:inherit;background:#fff;margin-top:8px}textarea{min-height:150px;resize:vertical}.success{color:#15803d;font-weight:800}.error{color:#b91c1c;font-weight:800}.mini{font-size:13px}@media(max-width:600px){.row,.top{flex-direction:column}.brand{font-size:25px}}
</style></head>
<body><div class="wrap">
<div class="top"><div><div class="brand">Lead2Job AI Agent</div><div class="muted">Analyse → menselijke controle → follow-up plannen</div></div><a class="btn secondary" href="/">Dashboard</a></div>
<div id="status" class="card muted">Sessie controleren...</div>
<div id="list"></div>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h3 id="title" style="margin:0">AI analyse</h3><button class="secondary" onclick="closeModal()">Sluiten</button></div><div id="body"></div></div></div>
<script>
const SB_URL='https://npqiispbwwinnnvzyybx.supabase.co';
const SB_KEY='sb_publishable_-igxS01wBSa1ImPr0u4Xwg_fmbNMTuM';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const aiResults={}; let leads=[];
function openModal(title,html){$('title').textContent=title;$('body').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
function leadById(id){return leads.find(l=>l.id===id)}
function defaultChannel(lead){if(lead?.phone)return 'whatsapp';if(lead?.email)return 'email';return 'phone'}
function localTomorrow(){const dt=new Date(Date.now()+86400000);return new Date(dt.getTime()-dt.getTimezoneOffset()*60000).toISOString().slice(0,16)}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){$('status').innerHTML='Niet ingelogd. <a href="/">Ga naar het dashboard om in te loggen.</a>';return}const {data,error}=await sb.from('leads').select('id,name,phone,email,service_type,city,status,estimated_value_min,estimated_value_max').order('created_at',{ascending:false}).limit(100);if(error){$('status').textContent='Laden mislukt: '+error.message;$('status').className='card error';return}leads=data||[];$('status').innerHTML='<strong>AI Agent actief.</strong> Er wordt niets automatisch naar klanten gestuurd.';$('status').className='card success';render()}
function render(){if(!leads.length){$('list').innerHTML='<div class="card muted">Geen leads gevonden.</div>';return}$('list').innerHTML=leads.map(l=>`<div class="card lead"><div class="row"><div><strong>${esc(l.name||'Onbekend')}</strong><div class="muted mini">${esc(l.service_type||'Geen dienst')} · ${esc(l.city||'Locatie onbekend')}</div><span class="badge">${esc(l.status||'new')}</span></div><div><strong>€${Number(l.estimated_value_max||l.estimated_value_min||0).toLocaleString('nl-NL')}</strong></div></div><div class="actions"><button onclick="analyze('${l.id}',this)">AI analyse</button></div></div>`).join('')}
async function analyze(id,btn){btn.disabled=true;const old=btn.textContent;btn.textContent='Analyseren...';openModal('AI analyse voor '+(leadById(id)?.name||'klant'),'<div class="muted">Gemini analyseert de lead...</div>');try{const {data,error}=await sb.functions.invoke('analyze-lead',{body:{lead_id:id}});if(error)throw error;if(!data?.success)throw new Error(data?.error||'Analyse mislukt');const a=data.analysis;aiResults[id]=a;const actionButtons=`<div class="actions">${a.needs_follow_up?`<button class="green" onclick="prepareFollowUp('${id}')">AI follow-up voorbereiden</button>`:''}${a.needs_appointment?`<button class="secondary" onclick="goAppointment('${id}')">Afspraak voorbereiden</button>`:''}</div>`;$('body').innerHTML=`<span class="badge">${esc(data.provider)} · ${esc(data.model)}</span><div class="result"><strong>Prioriteit:</strong> ${esc(a.priority)}\n<strong>Kwaliteit:</strong> ${esc(a.quality_score)}/100 (${esc(a.qualification)})\n\n<strong>Volgende actie:</strong>\n${esc(a.next_action)}\n\n<strong>Concept antwoord:</strong>\n${esc(a.reply_draft)}\n\n<strong>Follow-up:</strong> ${a.needs_follow_up?'ja':'nee'}\n<strong>Afspraak:</strong> ${a.needs_appointment?'ja':'nee'}\n\n<strong>Samenvatting:</strong>\n${esc(a.summary)}</div>${actionButtons}<p class="muted mini">Alle acties vereisen jouw bevestiging. Er wordt niets automatisch verstuurd.</p>`}catch(e){$('body').innerHTML='<div class="error">Analyse mislukt: '+esc(e?.message||e)+'</div>'}finally{btn.disabled=false;btn.textContent=old}}
function prepareFollowUp(id){const a=aiResults[id],lead=leadById(id);if(!a)return;const channel=defaultChannel(lead);openModal('AI follow-up controleren',`<div class="muted mini">Controleer datum, kanaal en tekst. Opslaan plant alleen een interne follow-up; er wordt niets verstuurd.</div><input id="due" type="datetime-local" value="${localTomorrow()}"><select id="channel"><option value="whatsapp" ${channel==='whatsapp'?'selected':''}>WhatsApp</option><option value="email" ${channel==='email'?'selected':''}>E-mail</option><option value="phone" ${channel==='phone'?'selected':''}>Telefoon</option></select><textarea id="message">${esc(a.reply_draft||'')}</textarea><div class="actions"><button class="green" onclick="saveFollowUp('${id}')">Follow-up plannen</button><button class="secondary" onclick="analyzeAgain('${id}')">Terug naar analyse</button></div><div id="saveMsg"></div>`)}
async function saveFollowUp(id){const due=$('due').value,msg=$('message').value.trim(),channel=$('channel').value;if(!due)return $('saveMsg').innerHTML='<div class="error">Kies datum en tijd.</div>';const {error}=await sb.from('follow_ups').insert({lead_id:id,due_at:new Date(due).toISOString(),channel,status:'pending',message:msg||null});if(error)return $('saveMsg').innerHTML='<div class="error">'+esc(error.message)+'</div>';const u=await sb.from('leads').update({status:'follow_up'}).eq('id',id);if(u.error)return $('saveMsg').innerHTML='<div class="error">'+esc(u.error.message)+'</div>';$('body').innerHTML='<div class="success">Follow-up gepland. Er is niets naar de klant verstuurd.</div><div class="actions"><a class="btn secondary" href="/">Terug naar dashboard</a></div>'}
function analyzeAgain(id){const a=aiResults[id];if(!a)return;openModal('AI analyse voor '+(leadById(id)?.name||'klant'),`<div class="result"><strong>Volgende actie:</strong>\n${esc(a.next_action)}\n\n<strong>Concept antwoord:</strong>\n${esc(a.reply_draft)}</div><div class="actions"><button class="green" onclick="prepareFollowUp('${id}')">AI follow-up voorbereiden</button></div>`)}
function goAppointment(id){location.href='/?lead='+encodeURIComponent(id)+'#appointments'}
load();
</script></body></html>
